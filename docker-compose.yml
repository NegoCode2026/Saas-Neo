services:
  db:
    image: postgres:16-alpine
    container_name: stocklocal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocklocal
      POSTGRES_PASSWORD: stocklocal
      POSTGRES_DB: stocklocal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklocal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: stocklocal-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DATABASE_URL: "postgresql://stocklocal:stocklocal@db:5432/stocklocal"
      JWT_SECRET: "${JWT_SECRET:?Falta JWT_SECRET. Creá un .env desde .env.example}"
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
    container_name: stocklocal-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
